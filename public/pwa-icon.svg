<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12101e"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(124, 58, 237, 0.4)" stroke-width="8"/>

  <!-- Glowing background effect -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>

  <!-- Main Wallet Body -->
  <rect x="96" y="148" width="320" height="236" rx="36" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Top flap / Card slot decorative -->
  <rect x="136" y="116" width="240" height="56" rx="16" fill="url(#cardGrad)" opacity="0.9"/>

  <!-- Wallet Stitch Line -->
  <path d="M 112 176 L 400 176" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Flap closure -->
  <path d="M 336 216 L 416 216 C 438 216 438 316 416 316 L 336 316 Z" fill="#1e1b4b" stroke="rgba(124, 58, 237, 0.6)" stroke-width="4"/>

  <!-- Golden Coin / Clasp in closure -->
  <circle cx="366" cy="266" r="22" fill="#fbbf24"/>
  <circle cx="366" cy="266" r="16" fill="#f59e0b"/>
  <text x="366" y="273" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#78350f" text-anchor="middle">$</text>
</svg>
